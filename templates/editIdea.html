<!DOCTYPE html>
<html>
<head>
  <title>Muokkaa ideaa</title>
</head>
<body>

  <h1>Muokkaa ideaa</h1>

  <form action="/edit/{{ idea['id'] }}" method="post">
    <p>Otsikko:</p>
    <textarea name="title" rows="3" cols="50">{{ idea["title"] }}</textarea>

    <p>Kuvaus:</p>
    <textarea name="message" rows="5" cols="50">{{ idea["description"] }}</textarea>

    <br><br>
    <input type="submit" value="Tallenna muutokset">
  </form>

</body>
</html>
