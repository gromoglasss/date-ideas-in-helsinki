{% extends "layout.html" %}

{% block title %}Muokkaa ideaa{% endblock %}

{% block content %}
  <h1>Muokkaa ideaa</h1>

  <form action="/edit/{{ idea['id'] }}" method="post">
    <label for="title">Otsikko:</label>
    <textarea name="title" id="title" rows="3" cols="50" maxlength="100" required>{{ filled.title }}</textarea>

    <label for="message">Kuvaus:</label>
    <textarea name="message" id="message" rows="5" cols="50" maxlength="1000">{{ filled.description }}</textarea>

    {% for class_title in all_classes %}
      <fieldset class="choices">
        <legend>{{ class_title }}</legend>
        {% for option in all_classes[class_title] %}
          <input type="checkbox" name="classes" id="class_{{ option['id'] }}" value="{{ option['id'] }}"
                 {% if option["id"] in selected %}checked{% endif %}>
          <label for="class_{{ option['id'] }}">{{ option["value"] }}</label>
        {% endfor %}
      </fieldset>
    {% endfor %}

    <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
    <br>
    <input type="submit" value="Tallenna muutokset">
  </form>
{% endblock %}
