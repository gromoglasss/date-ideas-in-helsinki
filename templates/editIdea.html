<!DOCTYPE html>
<html>
<head>
  <title>Muokkaa ideaa</title>
</head>
<body>

  <h1>Muokkaa ideaa</h1>

  <form action="/update/{{ idea[0] }}" method="post">
    <p>Otsikko:</p>
    <textarea name="title" rows="3" cols="50">{{ idea[1] }}</textarea>

    <p>Kuvaus:</p>
    <textarea name="message" rows="3" cols="50">{{ idea[2] }}</textarea>

    <br><br>
    <input type="submit" value="Save">
  </form>

</body>
</html>
