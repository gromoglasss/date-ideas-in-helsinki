{% extends "layout.html" %}

{% block title %}Lisää idea{% endblock %}

{% block content %}
  <h1>Lisää idea</h1>

  <form action="/add" method="post" enctype="multipart/form-data">
    <label for="photo">Lisää kuva:</label>
    <input type="file" name="photo" id="photo" accept=".jpg,.jpeg,.png,.gif,.webp">

    <label for="title">Otsikko:</label>
    <textarea name="title" id="title" rows="3" cols="50" maxlength="100" required></textarea>

    <label for="message">Kuvaus:</label>
    <textarea name="message" id="message" rows="5" cols="50" maxlength="1000"></textarea>

    {% for class_title in all_classes %}
      <fieldset class="choices">
        <legend>{{ class_title }}</legend>
        {% for option in all_classes[class_title] %}
          <input type="checkbox" name="classes" id="class_{{ option['id'] }}" value="{{ option['id'] }}"
                 {% if option["id"] in selected %}checked{% endif %}>
          <label for="class_{{ option['id'] }}">{{ option["value"] }}</label>
        {% endfor %}
      </fieldset>
    {% endfor %}

    <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
    <br>
    <input type="submit" value="Lähetä">
  </form>
{% endblock %}
